# =============================================================================
# Food-Coop Backend Configuration
# =============================================================================
# Values are read from environment variables.
# these variables are usually provided through Docker Compose
# and the `.env` file in the infrastructure repository.
# =============================================================================


# =============================================================================
# Server
# =============================================================================

server.port=${SERVER_PORT:8080}


# =============================================================================
# MariaDB / Datasource
# =============================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/foodcoops}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:foodcoops}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:foodcoops}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}


# =============================================================================
# JPA / Hibernate
# =============================================================================


spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.generate-ddl=${SPRING_JPA_GENERATE_DDL:true}
spring.datasource.initialization-mode=${SPRING_DATASOURCE_INITIALIZATION_MODE:always}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}



# =============================================================================
# Mail
# =============================================================================

spring.mail.host=${SPRING_MAIL_HOST:smtp.ionos.de}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}