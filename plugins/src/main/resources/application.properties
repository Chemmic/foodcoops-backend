# =============================================================================
# Food-Coop Backend Configuration
# =============================================================================
#
# Configuration is supplied primarily through environment variables.
#
# In Docker these variables are passed by foodcoops-infra/compose.yaml.
#
# =============================================================================


# =============================================================================
# Server
# =============================================================================

server.port=${SERVER_PORT:8080}


# =============================================================================
# MariaDB / Datasource
# =============================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/foodcoops}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:foodcoops}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}


# =============================================================================
# JPA / Hibernate
# =============================================================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.generate-ddl=${SPRING_JPA_GENERATE_DDL:false}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Lädt nachzuladende Entities/Collections gebündelt ("where id in (...)")
# statt einzeln – verhindert hunderte Einzelabfragen (N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=${SPRING_JPA_BATCH_FETCH_SIZE:100}


# =============================================================================
# SQL initialization
# =============================================================================
#
# Current Spring Boot property for schema.sql / data.sql initialization.
#
# Possible values include:
#
#   always
#   embedded
#   never
#
# =============================================================================

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}


# =============================================================================
# OAuth2 / Keycloak
# =============================================================================
#
# Public issuer:
#
#   http://SERVER_IP/auth/realms/foodcoop
#
# JWK Set can be fetched internally through Docker:
#
#   http://keycloak:8080/auth/realms/foodcoop/protocol/openid-connect/certs
#
# =============================================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}


# =============================================================================
# Food-Coop / Keycloak
# =============================================================================
#
# Application-specific properties (read by SecurityConfiguration,
# KeycloakAdminClient and BenutzerverwaltungService).
#
# Benutzerverwaltung:
#
#   The backend uses the confidential client KEYCLOAK_BACKEND_CLIENT_ID with
#   "Client authentication" + "Service accounts roles" enabled. Its service
#   account needs these roles of the client "realm-management":
#
#     view-users, query-users, manage-users,
#     view-clients, query-clients, manage-clients
#
#   (manage-clients is only needed to create / delete roles.)
#
#   KEYCLOAK_SERVER_URL is the base URL incl. relative path,
#   e.g. http://keycloak:8080/auth (Docker) or https://mika.foodcoop.fun/auth.
#
#   Local development (IntelliJ run configuration -> Environment variables):
#
#     KEYCLOAK_SERVER_URL=https://mika.foodcoop.fun/auth
#     KEYCLOAK_BACKEND_CLIENT_SECRET=...
#
#   If issuer-uri / jwk-set-uri are empty, the token issuer is derived from
#   KEYCLOAK_SERVER_URL + realm. Spring Boot does NOT read the .env file.
#
# =============================================================================

foodcoops.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8089}

foodcoops.keycloak.realm=${KEYCLOAK_REALM:foodcoop}

foodcoops.keycloak.backend-client-id=${KEYCLOAK_BACKEND_CLIENT_ID:foodcoop-backend}

foodcoops.keycloak.backend-client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET:}

# Roles shown in the user management: client roles of this client.
# Empty = realm roles (then view-realm / manage-realm instead of *-clients).
foodcoops.keycloak.role-client-id=${KEYCLOAK_ROLE_CLIENT_ID:foodcoop-pwa}

# Realm role required for the user management (/keycloak/admin/**)
foodcoops.keycloak.admin-role=${KEYCLOAK_ADMIN_ROLE:Admin}

# Role that decides the final supplier order (/organisation/**); Admin may too
foodcoops.keycloak.organisator-role=${KEYCLOAK_ORGANISATOR_ROLE:Organisator}

# Used as redirect after e-mail actions (e.g. "set password") - optional
foodcoops.keycloak.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:foodcoop-pwa}

foodcoops.keycloak.frontend-url=${FRONTEND_PUBLIC_URL:}


# =============================================================================
# Security
# =============================================================================
#
# false: only /keycloak/** requires a token (default, backwards compatible)
# true:  every endpoint requires a valid Keycloak token
#
# =============================================================================

foodcoops.security.require-authentication=${SECURITY_REQUIRE_AUTHENTICATION:false}


# =============================================================================
# Mail
# =============================================================================

spring.mail.host=${SPRING_MAIL_HOST:smtp.ionos.de}

spring.mail.port=${SPRING_MAIL_PORT:587}

spring.mail.username=${SPRING_MAIL_USERNAME:}

spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}

spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

# Sender - must match the SMTP account at most providers (default: SMTP user)
foodcoops.mail.from=${MAIL_FROM:${SPRING_MAIL_USERNAME:}}

# Display name of the sender - default: name of the foodcoop
foodcoops.mail.from-name=${MAIL_FROM_NAME:${FOODCOOP_NAME:}}

# Name of the foodcoop in mail subjects, greetings and order PDFs
foodcoops.name=${FOODCOOP_NAME:FoodCoop MiKa}

# Subjects - placeholders: %foodcoop%, %datum%, %person%
foodcoops.mail.betreff.einkauf=${MAIL_BETREFF_EINKAUF:Dein Einkauf bei der %foodcoop% am %datum%}

foodcoops.mail.betreff.einkaufsmanagement=${MAIL_BETREFF_EINKAUFSMANAGEMENT:Einkauf von %person% bei der %foodcoop% am %datum%}