# =============================================================================
# Food-Coop Backend Configuration
# =============================================================================
#
# Configuration is supplied primarily through environment variables.
#
# In Docker these variables are passed by foodcoops-infra/compose.yaml.
#
# =============================================================================


# =============================================================================
# Server
# =============================================================================

server.port=${SERVER_PORT:8080}


# =============================================================================
# MariaDB / Datasource
# =============================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/foodcoops}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:foodcoops}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:foodcoops}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}


# =============================================================================
# JPA / Hibernate
# =============================================================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}

spring.jpa.generate-ddl=${SPRING_JPA_GENERATE_DDL:false}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}


# =============================================================================
# SQL initialization
# =============================================================================
#
# Current Spring Boot property for schema.sql / data.sql initialization.
#
# Possible values include:
#
#   always
#   embedded
#   never
#
# =============================================================================

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}


# =============================================================================
# OAuth2 / Keycloak
# =============================================================================
#
# Public issuer:
#
#   http://SERVER_IP/auth/realms/foodcoop
#
# JWK Set can be fetched internally through Docker:
#
#   http://keycloak:8080/auth/realms/foodcoop/protocol/openid-connect/certs
#
# =============================================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}


# =============================================================================
# Food-Coop / Keycloak
# =============================================================================
#
# These are application-specific properties, not standard Spring properties.
#
# Only keep them if your Java code actually reads them.
#
# =============================================================================

foodcoops.keycloak.realm=${KEYCLOAK_REALM:foodcoop}

foodcoops.keycloak.backend-client-id=${KEYCLOAK_BACKEND_CLIENT_ID:foodcoop-backend}


# =============================================================================
# Mail
# =============================================================================

spring.mail.host=${SPRING_MAIL_HOST:smtp.ionos.de}

spring.mail.port=${SPRING_MAIL_PORT:587}

spring.mail.username=${SPRING_MAIL_USERNAME:}

spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}

spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}